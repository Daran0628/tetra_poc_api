# =====================================================================
# Issuance Service — 로컬(docker-compose) 환경 values
# ---------------------------------------------------------------------
# Helm values.yaml 처럼 "환경마다 달라지는 값"만 여기에 모은다.
#  - application.yml 은 구조와 ${values.*} 참조만 갖고, 실제 값은 이 파일에서 읽는다.
#  - 값을 바꿀 때는 이 파일만 고친다. 새 변수를 추가하면
#    PLAN&DATA/PoC_개발_진행.md 0-2 표에도 같이 추가한다.
#  - dev/prod 는 values-dev.yml / values-prod.yml 로 추가하고,
#    비밀값은 EKS Secret(환경변수)으로 덮어쓴다.
# =====================================================================
values:

  # --- MySQL (PoC/docker-compose.yml 의 mysql 서비스와 같은 값) ---------
  db:
    host: localhost
    port: 3306
    name: tetra_poc
    username: tetra
    password: tetra            # 로컬 전용. 배포 환경은 Secret 으로 주입

  # --- Redis / Valkey (docker-compose 의 valkey 서비스) ----------------
  redis:
    host: localhost
    port: 6379

  # --- 시간대 (DB 저장 타임존 KST 와 맞춤, 진행 문서 M0-1 S3) ----------
  timezone: Asia/Seoul

  # --- 세션 (D4·D6) ----------------------------------------------------
  session:
    # 세션 발급 후 302 로 보낼 대기방 경로. {eventId} 는 실제 값으로 치환됨.
    # 반드시 "/" 로 시작하는 상대 경로만 (절대 주소·"//" 불가).
    #   CloudFront → ALB 구간에서 Host 가 오리진 주소(origin.gamza-dev.shop)로 바뀌어 들어오므로,
    #   절대 주소를 쓰거나 Host 로 주소를 만들면 브라우저가 오리진으로 이동해 버린다.
    # TODO(임시, 2026-10-01): 대기방 경로가 정해지면 교체
    redirect-url: /
    cookie-name: TETRA_SID
    ttl: 2h
    cookie-secure: true        # localhost 는 브라우저가 보안 출처로 취급해 Secure 쿠키 허용

  # --- 대기열 커서 (플랜 4-3) ------------------------------------------
  queue:
    cursor-step: 300           # 윈도우당 커서 증가량 (부하테스트 후 조정)
    cursor-window: 3s          # 커서 증가 윈도우 = advance-lock TTL
    cursor-cache-s-maxage: 1s  # Cache-Control: public, max-age=0, s-maxage={값}

  # --- JWT (플랜 4-1) --------------------------------------------------
  jwt:
    user-id-max-length: 128
    # 테넌트 서버와 시계가 이만큼 어긋나도 만료 판정을 봐준다 (exp 1~2분 토큰이라 작게)
    clock-skew: 5s
    # exp 가 지금부터 이보다 멀면 거절 (1년짜리 토큰 같은 비정상 토큰 차단, jti 키 수명도 이 안으로 제한)
    max-ttl: 5m
    # 테스트 JWT 서명용 개인키 (로컬 전용, scripts/gen-test-keys.sh 로 생성).
    # 상대 경로는 issuance-service 폴더에서 실행할 때 기준.
    test-private-key-path: ../local-keys/test-jwt-private.pem

  # --- 헬스체크 (Actuator) ---------------------------------------------
  management:
    # /actuator/health 응답에 db·redis 같은 구성요소별 상태를 보여줄지.
    # always: 로컬 디버깅용 / never: 배포 환경 권장(내부 구성 노출 방지, 전체 UP·DOWN만 응답)
    health-show-details: always

  # --- 재고 워밍업 (플랜 4-4) ------------------------------------------
  stock:
    # if-absent: Redis 에 재고 키가 없을 때만 MySQL stock_count 로 채움 (재기동해도 차감분 유지)
    # force    : 항상 덮어씀 (로컬에서 재고를 처음 상태로 되돌릴 때만)
    #            배포 환경 금지 — Pod 가 뜰 때마다 실행되므로 재시작·스케일아웃 때 재고가 처음으로 돌아감
    warmup-mode: if-absent
